<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4. Per-Shard State Machine — Goblin Dynamic Sharding</title>
<link rel="stylesheet" href="slides.css">
</head>
<body>
<main>
  <section id="shardstate">
    <h2><span class="num">4</span>Per-Shard State Machine</h2>
    <div class="svgwrap">
      <svg viewBox="0 0 920 170" role="img" aria-label="Shard states">
        <g font-size="13">
          <rect x="20" y="60" width="150" height="50" rx="10" fill="#23284a" stroke="var(--line)"/>
          <text x="95" y="90" fill="var(--ink)" text-anchor="middle">At Source (stable)</text>

          <rect x="250" y="60" width="200" height="50" rx="10" fill="#2a2030" stroke="var(--src)"/>
          <text x="350" y="83" fill="var(--src)" text-anchor="middle">EXPORTING (source)</text>
          <text x="350" y="100" fill="var(--tgt)" text-anchor="middle" font-size="11">IMPORTING (target)</text>

          <rect x="540" y="60" width="180" height="50" rx="10" fill="#1d2e33" stroke="var(--tgt)"/>
          <text x="630" y="90" fill="var(--tgt)" text-anchor="middle">Draining / acked</text>

          <rect x="780" y="60" width="120" height="50" rx="10" fill="#1d3326" stroke="var(--ok)"/>
          <text x="840" y="90" fill="var(--ok)" text-anchor="middle">At Target</text>

          <line x1="170" y1="85" x2="248" y2="85" stroke="var(--accent)" stroke-width="2" marker-end="url(#a4)"/>
          <text x="208" y="50" fill="var(--muted)" font-size="11" text-anchor="middle">StartMigration</text>
          <line x1="450" y1="85" x2="538" y2="85" stroke="var(--accent)" stroke-width="2" marker-end="url(#a4)"/>
          <text x="494" y="50" fill="var(--muted)" font-size="11" text-anchor="middle">MigrateBatch</text>
          <line x1="720" y1="85" x2="778" y2="85" stroke="var(--accent)" stroke-width="2" marker-end="url(#a4)"/>
          <text x="749" y="50" fill="var(--muted)" font-size="11" text-anchor="middle">EndMigration</text>
        </g>
        <defs><marker id="a4" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6 Z" fill="var(--accent)"/></marker></defs>
      </svg>
    </div>
    <p class="muted">The route version is <b>only</b> bumped at the final transition, so clients keep pointing at the
    source for the whole migration window and never see a half-moved shard through the route table.</p>
  </section>
</main>
