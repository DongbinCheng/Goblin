<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goblin · Write Throughput &amp; Latencies</title>
<style>
  :root { --p50:#3b76d6; --p99:#d64531; --ink:#1b1b1b; --grid:#d9d9d9; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; color:var(--ink); background:#fff; }
  .wrap { max-width:880px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { color:#555; margin:0 0 16px; }
  svg { width:100%; height:auto; display:block; }
  .axis { stroke:#333; stroke-width:1.5; }
  .grid { stroke:var(--grid); stroke-width:1; }
  .tick { font:12px/1 inherit; fill:#444; }
  .axis-title { font:600 14px/1 inherit; fill:#333; }
  table { border-collapse:collapse; margin-top:18px; font-size:14px; }
  th,td { border:1px solid #ccc; padding:6px 12px; text-align:right; }
  th { background:#f5f5f5; }
  .legend { font:600 13px/1 inherit; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Throughput and Latencies (Write)</h1>
  <p class="sub">Latency (ms) vs. throughput (writes/sec) on the "Cross DC" deployment, payload size 1KB.</p>
  <svg viewBox="0 0 760 440" role="img" aria-label="Write throughput and latency line chart">
    <!-- plot area: x 80..720 (640 wide), y 40..360 (320 tall) -->
    <!-- x: 0..24000 ; y: 0..140 -->
    <!-- legend -->
    <rect x="300" y="14" width="13" height="13" fill="var(--p50)"/><text x="320" y="25" class="legend">p50</text>
    <rect x="400" y="14" width="13" height="13" fill="var(--p99)"/><text x="420" y="25" class="legend">p99</text>

    <!-- gridlines + y ticks (0,20,...,140) -->
    <g>
      <line class="grid" x1="80" y1="360" x2="720" y2="360"/><text class="tick" x="72" y="364" text-anchor="end">0</text>
      <line class="grid" x1="80" y1="314" x2="720" y2="314"/><text class="tick" x="72" y="318" text-anchor="end">20</text>
      <line class="grid" x1="80" y1="269" x2="720" y2="269"/><text class="tick" x="72" y="273" text-anchor="end">40</text>
      <line class="grid" x1="80" y1="223" x2="720" y2="223"/><text class="tick" x="72" y="227" text-anchor="end">60</text>
      <line class="grid" x1="80" y1="177" x2="720" y2="177"/><text class="tick" x="72" y="181" text-anchor="end">80</text>
      <line class="grid" x1="80" y1="131" x2="720" y2="131"/><text class="tick" x="72" y="135" text-anchor="end">100</text>
      <line class="grid" x1="80" y1="86"  x2="720" y2="86"/><text class="tick" x="72" y="90"  text-anchor="end">120</text>
      <line class="grid" x1="80" y1="40"  x2="720" y2="40"/><text class="tick" x="72" y="44"  text-anchor="end">140</text>
    </g>

    <!-- axes -->
    <line class="axis" x1="80" y1="40" x2="80" y2="360"/>
    <line class="axis" x1="80" y1="360" x2="720" y2="360"/>

    <!-- x ticks: 200,3200,...,21300 (approx) -->
    <g class="tick" text-anchor="middle">
      <text x="80"  y="380">200</text>
      <text x="171" y="380">3200</text>
      <text x="251" y="380">6200</text>
      <text x="331" y="380">9200</text>
      <text x="411" y="380">12200</text>
      <text x="491" y="380">15200</text>
      <text x="571" y="380">18200</text>
      <text x="651" y="380">21300</text>
    </g>

    <!-- data points mapping: x = 80 + throughput/24000*640 ; y = 360 - latency/140*320 -->
    <!-- p99: (215,26.4)->(86,300) (10422,45.1)->(358,257) (23011,136.6)->(693,48) -->
    <polyline points="86,300 358,257 693,48" fill="none" stroke="var(--p99)" stroke-width="2.5"/>
    <g fill="var(--p99)"><rect x="81" y="295" width="10" height="10"/><rect x="353" y="252" width="10" height="10"/><rect x="688" y="43" width="10" height="10"/></g>

    <!-- p50: (215,16.2)->(86,323) (10422,19.7)->(358,315) (23011,26.6)->(693,299) -->
    <polyline points="86,323 358,315 693,299" fill="none" stroke="var(--p50)" stroke-width="2.5"/>
    <g fill="var(--p50)"><rect x="81" y="318" width="10" height="10"/><rect x="353" y="310" width="10" height="10"/><rect x="688" y="294" width="10" height="10"/></g>

    <!-- axis titles -->
    <text class="axis-title" x="400" y="412" text-anchor="middle">Throughput (writes/sec)</text>
    <text class="axis-title" x="26" y="200" text-anchor="middle" transform="rotate(-90 26 200)">Latency (ms)</text>
  </svg>

  <table>
    <thead><tr><th>Throughput</th><th>P50 latency (ms)</th><th>P99 latency (ms)</th></tr></thead>
    <tbody>
      <tr><td>215</td><td>16.2</td><td>26.4</td></tr>
      <tr><td>10422</td><td>19.7</td><td>45.1</td></tr>
      <tr><td>23011</td><td>26.6</td><td>136.6</td></tr>
    </tbody>
  </table>
</div>
</body>
</html>
