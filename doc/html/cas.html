<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goblin · CAS (Compare-And-Swap)</title>
<style>
  :root { --goblin:#aef3f5; --goblin-stroke:#1c8c93; --client1:#fff2a8; --client2:#bff2bf; --accent:#d6336c; --ink:#1b1b1b; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; color:var(--ink); background:#fff; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { color:#555; margin:0 0 20px; }
  svg { width:100%; height:auto; display:block; }
  .label { font:600 16px/1.3 inherit; }
  .small { font:13px/1.3 inherit; fill:#444; }
  .accent { fill:var(--accent); font-weight:700; }
  .box-text { font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .flow { stroke:#8a8a8a; stroke-width:2; fill:none; }
  .flow-dashed { stroke:#9a9a9a; stroke-width:2; stroke-dasharray:6 5; fill:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>CAS (Compare-And-Swap)</h1>
  <p class="sub">Update a key only if its current version matches the expected version.</p>
  <svg viewBox="0 0 1000 520" role="img" aria-label="CAS sequence diagram">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L8,3 L0,6 Z" fill="#8a8a8a"/>
      </marker>
    </defs>

    <!-- Goblin cylinder -->
    <g>
      <path d="M360,70 a140,26 0 0 0 280,0 v360 a140,26 0 0 1 -280,0 Z" fill="var(--goblin)" stroke="var(--goblin-stroke)" stroke-width="2"/>
      <ellipse cx="500" cy="70" rx="140" ry="26" fill="var(--goblin)" stroke="var(--goblin-stroke)" stroke-width="2"/>
      <text x="500" y="118" text-anchor="middle" class="label">Goblin</text>

      <rect x="378" y="150" width="244" height="40" fill="#fff" stroke="#333"/>
      <text x="392" y="175" class="box-text">{accountA} ==&gt; {value=10, version=100}</text>

      <line x1="500" y1="190" x2="500" y2="240" class="flow" marker-end="url(#arrow)"/>

      <rect x="378" y="240" width="244" height="40" fill="#fff" stroke="#333"/>
      <text x="392" y="265" class="box-text">{accountA} ==&gt; {value=20, version=<tspan class="accent">101</tspan>}</text>

      <rect x="378" y="305" width="244" height="100" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 5"/>
      <text x="392" y="332" class="box-text">Write Lock accountA;</text>
      <text x="392" y="362" class="box-text">If (<tspan class="accent">version==100</tspan>)</text>
      <text x="392" y="385" class="box-text">{ value=20, version=next_version }</text>
    </g>

    <!-- Client1 -->
    <circle cx="95" cy="190" r="34" fill="var(--client1)" stroke="#caa800"/>
    <text x="95" y="245" text-anchor="middle" class="small">Client1</text>
    <path d="M129,178 C200,150 300,160 376,170" class="flow" marker-end="url(#arrow)"/>
    <text x="150" y="120" class="small">1. Read key accountA</text>
    <text x="150" y="138" class="small">Get version=100</text>

    <!-- Client1 failed write -->
    <path d="M112,222 C200,300 300,300 376,265" class="flow-dashed" marker-end="url(#arrow)"/>
    <text x="120" y="430" class="small">3. Write <tspan class="accent">Fail</tspan></text>
    <text x="120" y="450" class="small">(accountA, value:30, condition: <tspan class="accent">version==100</tspan>)</text>

    <!-- Client2 -->
    <circle cx="905" cy="270" r="34" fill="var(--client2)" stroke="#5bb85b"/>
    <text x="905" y="325" text-anchor="middle" class="small">Client2</text>
    <path d="M871,262 C780,240 700,250 624,260" class="flow" marker-end="url(#arrow)"/>
    <text x="720" y="222" class="small">2. Write Success</text>
    <text x="720" y="240" class="small">(accountA, value:20)</text>
  </svg>
</div>
</body>
</html>
