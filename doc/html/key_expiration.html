<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goblin · Key Expiration</title>
<style>
  :root { --goblin:#aef3f5; --goblin-stroke:#1c8c93; --client1:#fff2a8; --accent:#d6336c; --ink:#1b1b1b; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; color:var(--ink); background:#fff; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { color:#555; margin:0 0 20px; }
  svg { width:100%; height:auto; display:block; }
  .label { font:600 16px/1.3 inherit; }
  .small { font:14px/1.3 inherit; fill:#333; }
  .accent { fill:var(--accent); font-weight:700; }
  .box-text { font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .flow { stroke:#8a8a8a; stroke-width:2; fill:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Key Expiration (TTL)</h1>
  <p class="sub">A deadline is stored with the key; reads after the deadline return null, and expired keys are removed by compaction.</p>
  <svg viewBox="0 0 1000 420" role="img" aria-label="Key expiration diagram">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L8,3 L0,6 Z" fill="#8a8a8a"/>
      </marker>
    </defs>

    <!-- Client -->
    <circle cx="120" cy="210" r="38" fill="var(--client1)" stroke="#caa800"/>
    <text x="120" y="270" text-anchor="middle" class="small">Client</text>

    <!-- Write arrow -->
    <path d="M150,185 C280,120 380,150 470,170" class="flow" marker-end="url(#arrow)"/>
    <text x="250" y="120" class="small">Write (key, value, <tspan class="accent">ttl</tspan>)</text>

    <!-- Read arrow -->
    <path d="M150,235 C280,300 380,290 470,275" class="flow" marker-end="url(#arrow)"/>
    <text x="270" y="330" class="small">Read (key)</text>

    <!-- Goblin cylinder -->
    <path d="M470,70 a160,26 0 0 0 320,0 v260 a160,26 0 0 1 -320,0 Z" fill="var(--goblin)" stroke="var(--goblin-stroke)" stroke-width="2"/>
    <ellipse cx="630" cy="70" rx="160" ry="26" fill="var(--goblin)" stroke="var(--goblin-stroke)" stroke-width="2"/>
    <text x="630" y="118" text-anchor="middle" class="label">Goblin</text>

    <rect x="492" y="150" width="280" height="40" fill="#fff" stroke="#333"/>
    <text x="504" y="175" class="box-text" font-size="13">{key} ==&gt; {metaInfo_version_<tspan class="accent">ttl_deadline</tspan>_value}</text>

    <rect x="492" y="230" width="280" height="70" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="504" y="262" class="box-text" font-size="13">If (<tspan class="accent">current_time &lt; deadline</tspan>) { return value; }</text>
    <text x="504" y="284" class="box-text" font-size="13">else { return null; }</text>
  </svg>
</div>
</body>
</html>
