<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goblin · ISR (In-sync Replica Read)</title>
<style>
  :root { --goblin:#aef3f5; --leader:#f5a9a9; --follower:#aee9f5; --lag:#d9d9d9; --clientlib:#d9f7d4; --accent:#d6336c; --ink:#1b1b1b; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; color:var(--ink); background:#fff; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { color:#555; margin:0 0 20px; }
  svg { width:100%; height:auto; display:block; }
  .small { font:14px/1.3 inherit; fill:#333; }
  .node-num { font:600 16px/1 inherit; }
  .flow { stroke:#8a8a8a; stroke-width:2; fill:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>ISR (In-sync Replica Read)</h1>
  <p class="sub">The client periodically fetches the in-sync replica list from the leader and reads only from followers whose lag is within the threshold.</p>
  <svg viewBox="0 0 1000 480" role="img" aria-label="ISR diagram">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L8,3 L0,6 Z" fill="#8a8a8a"/>
      </marker>
    </defs>

    <!-- Client Lib box -->
    <rect x="300" y="40" width="180" height="170" rx="6" fill="var(--clientlib)" stroke="#5bb85b"/>
    <text x="390" y="64" text-anchor="middle" class="small" font-weight="700">Client Lib</text>
    <rect x="320" y="78" width="140" height="118" fill="#fff" stroke="#999"/>
    <text x="390" y="100" text-anchor="middle" class="small">Memory</text>
    <rect x="338" y="115" width="104" height="34" fill="#f5a9a9" stroke="#c66"/>
    <text x="390" y="137" text-anchor="middle" class="small" font-weight="700">ISR List</text>
    <rect x="338" y="149" width="104" height="30" fill="#fff" stroke="#c66"/>
    <text x="390" y="170" text-anchor="middle" class="small">1,2,3,5</text>

    <!-- Legend -->
    <rect x="600" y="40" width="240" height="140" rx="4" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="720" y="64" text-anchor="middle" class="small" fill="var(--accent)" font-weight="700">In-sync replica</text>
    <circle cx="640" cy="100" r="16" fill="var(--leader)" stroke="#c66"/>
    <text x="670" y="105" class="small">Leader</text>
    <circle cx="640" cy="145" r="16" fill="var(--follower)" stroke="#3aa6bd"/>
    <text x="670" y="150" class="small">Follower</text>
    <circle cx="640" cy="200" r="16" fill="var(--lag)" stroke="#999" stroke-dasharray="3 2"/>
    <text x="670" y="205" class="small">Lagging follower</text>

    <!-- Nodes row -->
    <g>
      <circle cx="120" cy="360" r="26" fill="var(--follower)" stroke="#3aa6bd"/><text x="120" y="366" text-anchor="middle" class="node-num">1</text>
      <circle cx="300" cy="360" r="26" fill="var(--leader)" stroke="#c66"/><text x="300" y="366" text-anchor="middle" class="node-num">2</text>
      <circle cx="470" cy="360" r="26" fill="var(--follower)" stroke="#3aa6bd"/><text x="470" y="366" text-anchor="middle" class="node-num">3</text>
      <circle cx="640" cy="360" r="26" fill="var(--lag)" stroke="#999" stroke-dasharray="3 2"/><text x="640" y="366" text-anchor="middle" class="node-num">4</text>
      <circle cx="820" cy="360" r="26" fill="var(--follower)" stroke="#3aa6bd"/><text x="820" y="366" text-anchor="middle" class="node-num">5</text>
    </g>

    <!-- Leader replicates to followers -->
    <path d="M326,350 C370,320 420,320 462,344" class="flow" marker-end="url(#arrow)"/>
    <path d="M322,378 C460,440 660,440 800,384" class="flow" marker-end="url(#arrow)"/>
    <path d="M276,378 C220,420 160,410 126,388" class="flow" marker-end="url(#arrow)"/>

    <!-- ISR Read from node 1 -->
    <path d="M330,210 C250,260 170,300 128,332" class="flow" marker-end="url(#arrow)"/>
    <text x="150" y="250" class="small">ISR Read</text>

    <!-- Get ISR list from leader -->
    <path d="M312,334 C340,290 370,240 388,200" class="flow" marker-end="url(#arrow)"/>
    <text x="300" y="252" class="small">Get ISR List periodically</text>
  </svg>
</div>
</body>
</html>
