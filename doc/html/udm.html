<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Goblin · UDM (User-Defined Meta)</title>
<style>
  :root { --goblin:#caf2c6; --goblin-stroke:#5bb85b; --client:#cdd0f0; --client-stroke:#7a7fd0; --red:#d6336c; --blue:#2f6fd6; --ink:#1b1b1b; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif; color:var(--ink); background:#fff; }
  .wrap { max-width:1180px; margin:0 auto; padding:24px 16px 40px; }
  h1 { font-size:1.4rem; margin:0 0 4px; }
  p.sub { color:#555; margin:0 0 20px; }
  svg { width:100%; height:auto; display:block; }
  .small { font:13px/1.3 inherit; fill:#222; }
  .red { fill:var(--red); }
  .blue { fill:var(--blue); }
  .flow { stroke:#333; stroke-width:2; fill:none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>UDM (User-Defined Meta)</h1>
  <p class="sub">Conditional, atomic update driven by user-defined metadata. Here a balance is only updated when the request's seqNum is GREATER than the stored one.</p>
  <svg viewBox="0 0 1180 520" role="img" aria-label="UDM diagram">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0,0 L8,3 L0,6 Z" fill="#333"/>
      </marker>
    </defs>

    <!-- Legend -->
    <rect x="40" y="40" width="210" height="130" fill="none" stroke="#999"/>
    <path d="M70,70 a16,5 0 0 0 32,0 v26 a16,5 0 0 1 -32,0 Z" fill="var(--goblin)" stroke="var(--goblin-stroke)"/>
    <ellipse cx="86" cy="70" rx="16" ry="5" fill="var(--goblin)" stroke="var(--goblin-stroke)"/>
    <text x="120" y="92" class="small">Goblin</text>
    <rect x="70" y="108" width="34" height="22" fill="var(--client)" stroke="var(--client-stroke)"/>
    <text x="120" y="124" class="small">Client</text>
    <path d="M70,140 h26 l8,8 v14 h-34 Z" fill="#fff" stroke="#333"/>
    <text x="120" y="158" class="small">Payload</text>

    <!-- Request 1 (client payload) -->
    <text x="510" y="58" text-anchor="middle" class="small" font-weight="700">Balance update request</text>
    <rect x="410" y="70" width="200" height="120" fill="var(--client)" stroke="var(--client-stroke)"/>
    <rect x="424" y="80" width="180" height="100" fill="#fff" stroke="#333"/>
    <text x="436" y="105" class="small">"accountId": 123456</text>
    <text x="436" y="128" class="small">"balance": 300</text>
    <text x="436" y="151" class="small red">"seqNum": 12 -&gt; UDM</text>
    <text x="436" y="174" class="small red">"operator": "GREATER"</text>

    <!-- Request 2 (client payload) -->
    <text x="930" y="58" text-anchor="middle" class="small" font-weight="700">Balance update request</text>
    <rect x="830" y="70" width="200" height="120" fill="var(--client)" stroke="var(--client-stroke)"/>
    <rect x="844" y="80" width="180" height="100" fill="#fff" stroke="#333"/>
    <text x="856" y="105" class="small">"accountId": 123456</text>
    <text x="856" y="128" class="small">"balance": 400</text>
    <text x="856" y="151" class="small blue">"seqNum": 9 -&gt; UDM</text>
    <text x="856" y="174" class="small blue">"operator": "GREATER"</text>

    <!-- Vertical request arrows -->
    <line x1="510" y1="190" x2="510" y2="320" class="flow" marker-end="url(#arrow)"/>
    <text x="510" y="240" text-anchor="middle" class="small red">12 &gt; 10:</text>
    <text x="510" y="262" text-anchor="middle" class="small">Balance updated</text>

    <line x1="930" y1="190" x2="930" y2="320" class="flow" marker-end="url(#arrow)"/>
    <text x="930" y="240" text-anchor="middle" class="small blue">9 &lt; 12:</text>
    <text x="930" y="262" text-anchor="middle" class="small">Do nothing</text>

    <!-- Goblin store states (cylinders) -->
    <g>
      <!-- state 0 -->
      <path d="M60,340 a110,20 0 0 0 220,0 v120 a110,20 0 0 1 -220,0 Z" fill="var(--goblin)" stroke="var(--goblin-stroke)"/>
      <ellipse cx="170" cy="340" rx="110" ry="20" fill="var(--goblin)" stroke="var(--goblin-stroke)"/>
      <rect x="80" y="378" width="180" height="74" fill="#fff" stroke="#fff"/>
      <text x="92" y="402" class="small">"accountId": 123456</text>
      <text x="92" y="424" class="small">"balance": 100</text>
      <text x="92" y="446" class="small red">"seqNum": 10</text>

      <!-- state 1 -->
      <path d="M400,340 a110,20 0 0 0 220,0 v120 a110,20 0 0 1 -220,0 Z" fill="var(--goblin)" stroke="var(--goblin-stroke)"/>
      <ellipse cx="510" cy="340" rx="110" ry="20" fill="var(--goblin)" stroke="var(--goblin-stroke)"/>
      <rect x="420" y="378" width="180" height="74" fill="#fff" stroke="#fff"/>
      <text x="432" y="402" class="small">"accountId": 123456</text>
      <text x="432" y="424" class="small">"balance": 300</text>
      <text x="432" y="446" class="small blue">"seqNum": 12</text>

      <!-- state 2 -->
      <path d="M820,340 a110,20 0 0 0 220,0 v120 a110,20 0 0 1 -220,0 Z" fill="var(--goblin)" stroke="var(--goblin-stroke)"/>
      <ellipse cx="930" cy="340" rx="110" ry="20" fill="var(--goblin)" stroke="var(--goblin-stroke)"/>
      <rect x="840" y="378" width="180" height="74" fill="#fff" stroke="#fff"/>
      <text x="852" y="402" class="small">"accountId": 123456</text>
      <text x="852" y="424" class="small">"balance": 300</text>
      <text x="852" y="446" class="small">"seqNum": 12</text>
    </g>

    <!-- transitions between store states -->
    <line x1="282" y1="410" x2="396" y2="410" class="flow" marker-end="url(#arrow)"/>
    <line x1="622" y1="410" x2="816" y2="410" class="flow" marker-end="url(#arrow)"/>
  </svg>
</div>
</body>
</html>
